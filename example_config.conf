# Example configuration file for Python-based Asterisk Calling Agent
# Copy this file to config.conf and fill in your actual API keys

# Gemini AI Configuration
GEMINI_API_KEY=your_gemini_api_key_here
GEMINI_MODEL=gemini-1.5-flash

# Deepgram Configuration
DEEPGRAM_API_KEY=your_deepgram_api_key_here
DEEPGRAM_MODEL=nova-2

# Asterisk Configuration
ARI_URL=http://127.0.0.1:6021
ARI_USER=asterisk
ARI_PASS=asterisk
ARI_APP=asterisk_app

# RTP Configuration
RTP_PORT_START=12000
MAX_CONCURRENT_CALLS=10

# Voice Activity Detection
VAD_THRESHOLD=0.6
VAD_PREFIX_PADDING_MS=200
VAD_SILENCE_DURATION_MS=600

# Logging
LOG_LEVEL=info

# System Configuration
SYSTEM_PROMPT=You are a helpful AI assistant. Be concise and helpful in your responses. Keep responses under 100 words.
INITIAL_MESSAGE=Hi! I'm your AI assistant. How can I help you today?
SILENCE_PADDING_MS=100
CALL_DURATION_LIMIT_SECONDS=0

# Audio Configuration
SAMPLE_RATE=8000
CHANNELS=1
CHUNK_SIZE=1024
AUDIO_FORMAT=mulaw
